<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Robotics Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1>Live Robotics Dashboard</h1>
        <p class="tagline">GitHub project activity and news headlines for the robotics ecosystem, auto-refreshing.</p>
      </div>
      <button id="refresh" class="btn btn-warning">Refresh now</button>
    </div>
  </header>

  <main class="container py-4">
    <div id="status" class="status" role="status"></div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="stat-card"><div class="stat-label">Repos tracked</div><div class="stat-value" id="statRepos">–</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><div class="stat-label">Total stars</div><div class="stat-value" id="statStars">–</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><div class="stat-label">Avg stars / repo</div><div class="stat-value" id="statAvg">–</div></div></div>
      <div class="col-6 col-lg-3"><div class="stat-card"><div class="stat-label">Articles this window</div><div class="stat-value" id="statArticles">–</div></div></div>
    </div>

    <div class="row g-4">
      <div class="col-lg-6">
        <div class="panel">
          <h2 class="h6 panel-title">Repos by language</h2>
          <canvas id="langChart" height="220"></canvas>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel">
          <h2 class="h6 panel-title">Articles by source</h2>
          <canvas id="sourceChart" height="220"></canvas>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-lg-6">
        <div class="panel">
          <h2 class="h6 panel-title">Top repositories by stars</h2>
          <ol id="topRepos" class="ranked-list"></ol>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="panel">
          <h2 class="h6 panel-title">Latest headlines</h2>
          <ol id="latestNews" class="ranked-list"></ol>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
